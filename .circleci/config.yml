version: 2.1

jobs:
  build:
    resource_class: small
    docker:
      - image: ubuntu:20.04
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            for i in 1 2 3; do
              apt-get update && \
              DEBIAN_FRONTEND=noninteractive TZ=Europe/Brussels apt-get install -y gcc g++ cmake git doxygen && break
              echo "Attempt $i failed, retrying in 15s..."
              sleep 15
            done
      - run: mkdir -p build
      - run: cd build && cmake ..
      - run: cd build && make
      - run: cd build && make install
      - run: cd build && make doc
      - store_artifacts:
          path: build/installed
      - store_artifacts:
          path: build/doc